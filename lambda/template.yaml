# Dotrino Vault en una AWS Lambda (prueba de concepto). Ver README.md.
#
# Se despliega en cualquier cuenta de AWS con esta plantilla y nada más: CloudFormation →
# Crear pila → subir este archivo. La plantilla de cada release (dotrino-vault-lambda-
# <versión>.yaml) trae ya la URL del código y su hash; la función se baja el zip de la
# release de GitHub, comprueba el hash y solo entonces lo usa.
#
# Al crearse, la bóveda nace con un usuario administrador (el usuario y la contraseña de los
# parámetros). La dirección para entrar —admin@AB12-CD34-EF56— sale en los Outputs.
#
# El bucket y la llave se QUEDAN aunque se borre la pila (`DeletionPolicy: Retain`): son la
# cuenta. Borrar la pila por error no puede llevársela. Para volver a montarla, se crea la pila
# con el mismo `Name` y la llave en `ExistingKeyArn`: entonces no crea ni bucket ni llave, usa
# los que quedaron.
#
# UNA BÓVEDA POR NOMBRE (`Name`), y se pueden tener todas las que se quiera en la misma
# cuenta. Los nombres de lo que importa salen de ese nombre de forma DETERMINISTA —el bucket,
# la función, el alias de la llave—: el mismo nombre da siempre los mismos recursos, y dos
# nombres no se pisan. Lo interno (los roles, el secreto de un solo uso) lo nombra AWS.
AWSTemplateFormatVersion: '2010-09-09'
Description: Dotrino Vault __VERSION__ in a Lambda (proof of concept)

Parameters:
  Name:
    Type: String
    Default: vault
    Description: this vault's name (up to 20 characters). Same name, same resources; another name, another vault in the same account.
    AllowedPattern: '[a-z0-9][a-z0-9-]{0,19}'
  Mode:
    Type: String
    Default: vault
    AllowedValues: [vault, replica, join, demo]
    Description: vault is a whole new account with its first administrator. replica joins an account you already have, with an invitation from your vault and a code you approve there; it has no master and can open nothing (dotrino-vault/docs/replicas.md). join is a second vault of an account you already have - it has its own master key, sealed with a password you set when it joins, and seals the record (dotrino-accounts/docs/DISENO.md section 5). demo is vault plus the Dotrino Terminal agent in the same function, for app store reviewers; it needs the demo code (lambda/build.sh --demo).
  Owner:
    Type: String
    Default: ''
    Description: replica and join modes only, and required there - the account it may join (pubkeyId of that profile's key, 64 hex). It refuses an invitation from any other account before showing its code.
    AllowedPattern: '([0-9a-f]{64})?'
  AdminUser:
    Type: String
    Default: admin
    AllowedPattern: '[a-z0-9][a-z0-9._-]{0,31}'
  AdminPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: vault mode only, and required there - the first administrator's password (12+ characters, no quotes or backslashes). It is used once, at the first start; change it after signing in.
    AllowedPattern: '([^"\\]{12,})?'
  ProxyUrl:
    Type: String
    Default: wss://proxy.dotrino.com
  ReservedConcurrency:
    Type: Number
    Default: 0
    Description: 1 keeps two containers from running at once. 0 leaves it unset (a new account cannot reserve below 10 unreserved); the session lock in S3 covers it.
  ExistingKeyArn:
    Type: String
    Default: ''
    Description: empty for a new vault. To bring back one whose stack was deleted, the ARN of its KMS key (the bucket comes from Name).
    AllowedPattern: '(arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]{36})?'
  SharedKeyArn:
    Type: String
    Default: ''
    Description: empty gives this vault its own KMS key ($1/month). The ARN of a key shared by several vaults of this account makes each vault use it only for itself (the vault name goes in the encryption context, and the role can use the key with nothing else).
    AllowedPattern: '(arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]{36})?'
  PermissionsBoundary:
    Type: String
    Default: ''
    Description: empty in your own account. The ARN of an IAM policy puts it as the permissions boundary of both roles, so whoever creates the stack can be allowed to create only roles that cannot do more than that (it is how Dotrino creates the hosted vaults).
    AllowedPattern: '(arn:aws[a-z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+)?'
  CodeUrl:
    Type: String
    Default: __CODE_URL__
  CodeSha256:
    Type: String
    Default: __CODE_SHA256__
    AllowedPattern: '[0-9a-f]{64}'

Rules:
  ReplicaHasOwner:
    RuleCondition: !Equals [!Ref Mode, replica]
    Assertions:
      - Assert: !Not [!Equals [!Ref Owner, '']]
        AssertDescription: a replica needs Owner, the account it may join
  JoinHasOwner:
    RuleCondition: !Equals [!Ref Mode, join]
    Assertions:
      - Assert: !Not [!Equals [!Ref Owner, '']]
        AssertDescription: a second vault needs Owner, the account it may join

Conditions:
  Reserve: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  New: !Equals [!Ref ExistingKeyArn, '']
  Shared: !Not [!Equals [!Ref SharedKeyArn, '']]
  CreateKey: !And [!Condition New, !Not [!Condition Shared]]
  Bounded: !Not [!Equals [!Ref PermissionsBoundary, '']]
  IsVault: !Or [!Equals [!Ref Mode, vault], !Equals [!Ref Mode, demo]]

Resources:
  ProfileBucket:
    Type: AWS::S3::Bucket
    Condition: New
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # La región va en el nombre porque los buckets son globales: el mismo `Name` en otra
      # región es otra bóveda.
      BucketName: !Sub dotrino-vault-${Name}-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  DiskKey:
    Type: AWS::KMS::Key
    Condition: CreateKey
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub dotrino-vault (lambda, ${Name}) wraps the disk key
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: account
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'

  DiskKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreateKey
    Properties:
      AliasName: !Sub alias/dotrino-vault-${Name}
      TargetKeyId: !GetAtt DiskKey.Arn

  # ---- el código: se baja de la release y se comprueba antes de usarlo -----------------
  CodeFetcherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      PermissionsBoundary: !If [Bounded, !Ref PermissionsBoundary, !Ref AWS::NoValue]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: code
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: s3:PutObject, Resource: !Join ['', [!If [New, !GetAtt ProfileBucket.Arn, !Sub 'arn:aws:s3:::dotrino-vault-${Name}-${AWS::AccountId}-${AWS::Region}'], '/code/*']] }

  CodeFetcher:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 120
      MemorySize: 512
      Role: !GetAtt CodeFetcherRole.Arn
      Code:
        ZipFile: |
          const crypto = require('crypto')
          const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3')
          async function answer (e, status, reason, data) {
            await fetch(e.ResponseURL, { method: 'PUT', headers: { 'content-type': '' }, body: JSON.stringify({
              Status: status, Reason: String(reason).slice(0, 1000), PhysicalResourceId: e.PhysicalResourceId || 'code',
              StackId: e.StackId, RequestId: e.RequestId, LogicalResourceId: e.LogicalResourceId, Data: data || {} }) })
          }
          exports.handler = async (e) => {
            if (e.RequestType === 'Delete') return answer(e, 'SUCCESS', 'nothing to do')
            try {
              const p = e.ResourceProperties
              const r = await fetch(p.Url)
              if (!r.ok) throw new Error('download failed: HTTP ' + r.status + ' ' + p.Url)
              const body = Buffer.from(await r.arrayBuffer())
              const sha = crypto.createHash('sha256').update(body).digest('hex')
              if (sha !== p.Sha256) throw new Error('the code does not match its hash: got ' + sha + ', expected ' + p.Sha256)
              const key = 'code/dotrino-vault-lambda-' + sha + '.zip'
              await new S3Client({}).send(new PutObjectCommand({ Bucket: p.Bucket, Key: key, Body: body }))
              await answer(e, 'SUCCESS', 'ok', { Key: key })
            } catch (err) { await answer(e, 'FAILED', err.message) }
          }

  Code:
    Type: Custom::DotrinoVaultCode
    Properties:
      ServiceToken: !GetAtt CodeFetcher.Arn
      Url: !Ref CodeUrl
      Sha256: !Ref CodeSha256
      Bucket: !If [New, !Ref ProfileBucket, !Sub 'dotrino-vault-${Name}-${AWS::AccountId}-${AWS::Region}']

  # ---- la bóveda ----------------------------------------------------------------------
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      PermissionsBoundary: !If [Bounded, !Ref PermissionsBoundary, !Ref AWS::NoValue]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: vault
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Join ['', [!If [New, !GetAtt ProfileBucket.Arn, !Sub 'arn:aws:s3:::dotrino-vault-${Name}-${AWS::AccountId}-${AWS::Region}'], '/vault/*']]
              # EL CÓDIGO QUE CORRE (`lambda/code.mjs`): la bóveda deja aquí la versión nueva ya
              # verificada y la apunta en `code/current.json`; la función la carga al arrancar.
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Join ['', [!If [New, !GetAtt ProfileBucket.Arn, !Sub 'arn:aws:s3:::dotrino-vault-${Name}-${AWS::AccountId}-${AWS::Region}'], '/code/*']]
              # ListBucket también para `code/`: sin él, S3 contesta 403 y no «no existe» cuando
              # todavía no hay marcador, y la función no arrancaría.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !If [New, !GetAtt ProfileBucket.Arn, !Sub 'arn:aws:s3:::dotrino-vault-${Name}-${AWS::AccountId}-${AWS::Region}']
                Condition: { StringLike: { 's3:prefix': ['vault/*', 'code/*'] } }
              # Con la llave COMPARTIDA, cada bóveda solo puede usarla con su propio nombre en el
              # contexto: el sobre de otra bóveda no se abre con este rol.
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt]
                Resource: !If [Shared, !Ref SharedKeyArn, !If [New, !GetAtt DiskKey.Arn, !Ref ExistingKeyArn]]
                Condition: !If [Shared, { StringEquals: { 'kms:EncryptionContext:vault': !Ref Name } }, !Ref AWS::NoValue]
              # Al despertarla, la función se invoca a sí misma en modo asíncrono.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:dotrino-vault-${Name}'

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub dotrino-vault-${Name}
      Runtime: nodejs24.x
      Handler: lambda/handler.handler
      Code:
        S3Bucket: !If [New, !Ref ProfileBucket, !Sub 'dotrino-vault-${Name}-${AWS::AccountId}-${AWS::Region}']
        S3Key: !GetAtt Code.Key
      MemorySize: 1024
      # El máximo de Lambda: una sesión dura hasta que pasan 60 s sin mensajes, o hasta poco
      # antes de este tope (ver `lambda/session.mjs`).
      Timeout: 900
      Role: !GetAtt Role.Arn
      ReservedConcurrentExecutions: !If [Reserve, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Environment:
        Variables:
          DOTRINO_VAULT_BUCKET: !If [New, !Ref ProfileBucket, !Sub 'dotrino-vault-${Name}-${AWS::AccountId}-${AWS::Region}']
          DOTRINO_VAULT_PREFIX: vault/
          DOTRINO_KMS_KEY_ID: !If [Shared, !Ref SharedKeyArn, !If [New, !GetAtt DiskKey.Arn, !Ref ExistingKeyArn]]
          DOTRINO_KMS_CONTEXT_VAULT: !If [Shared, !Ref Name, !Ref AWS::NoValue]
          DOTRINO_PROXY_URL: !Ref ProxyUrl
          DOTRINO_VAULT_MODE: !Ref Mode
          DOTRINO_REPLICA_OWNER: !Ref Owner

  # Una sesión que falla no se repite sola: la siguiente la dispara el próximo mensaje.
  AsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Function
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      # La puerta es el secreto de la URL de despertar, que solo conocen la bóveda y el
      # proxio. Lo demás contesta 404.
      AuthType: NONE

  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  # El primer arranque. En modo `vault`: nace la cuenta, se registra la URL de despertar en el
  # proxio y se da de alta al administrador; devuelve su dirección. En `replica` y `join` no nace
  # nada: se apunta la URL de la función y espera a que su dueño la enrole.
  FirstStart:
    Type: Custom::DotrinoVaultFirstStart
    DependsOn: [UrlPermission, UrlInvokePermission, AsyncConfig]
    Properties:
      ServiceToken: !GetAtt Function.Arn
      FunctionUrl: !GetAtt FunctionUrl.FunctionUrl
      Mode: !Ref Mode
      AdminUser: !Ref AdminUser
      # Directa, sin Secrets Manager ($0,40/mes por bóveda): es un parámetro NoEcho, así que
      # CloudFormation la enseña tapada, y solo sirve para el PRIMER alta (después, ensureAdmin
      # no la vuelve a pedir). El administrador la cambia al entrar.
      AdminPassword: !Ref AdminPassword
      CodeKey: !GetAtt Code.Key

Outputs:
  Login:
    Condition: IsVault
    Description: enter with this address and the admin password, from "Sign in" in any Dotrino app
    Value: !GetAtt FirstStart.Login
  Account:
    Condition: IsVault
    Description: the account's full fingerprint (64 hex), what signed requests from this account are checked against
    Value: !GetAtt FirstStart.Account
  Mode:
    Value: !Ref Mode
  Url:
    Value: !GetAtt FunctionUrl.FunctionUrl
  Bucket:
    Value: !If [New, !Ref ProfileBucket, !Sub 'dotrino-vault-${Name}-${AWS::AccountId}-${AWS::Region}']
  KeyArn:
    Description: keep it; with it a deleted stack comes back (ExistingKeyArn, or SharedKeyArn if it is shared)
    Value: !If [Shared, !Ref SharedKeyArn, !If [New, !GetAtt DiskKey.Arn, !Ref ExistingKeyArn]]
