# Publica una versión del vault DESDE CI, no desde el portátil de nadie.
#
# Hasta hoy el `.deb` se construía a mano y se subía a mano: quien lo recibía no tenía
# forma de comprobar de qué commit salió. Aquí cada artefacto queda atado a su commit y a
# este workflow, con una atestación firmada por sigstore que cualquiera puede verificar:
#
#   gh attestation verify dotrino-vault_X.Y.Z_amd64.deb --repo imdotrino/dotrino-vault
#   gh attestation verify dotrino-vault-X.Y.Z-1.x86_64.rpm --repo imdotrino/dotrino-vault
#
# Y de paso salen las tres cosas que el CRA da por supuestas y no teníamos: SBOM por
# release, procedencia de los paquetes npm y artefactos firmados (ver CUMPLIMIENTO.md §2).
name: Release

on:
  push:
    # `v[0-9]*` y no `v*`: el glob de antes capturaba también `vaultd-v0.97.0` —empieza por
    # «v»—, así que etiquetar la imagen de Docker lanzaba ADEMÁS un release entero, con su
    # release de GitHub duplicada. Los publish de npm no se rompían porque ya se saltan lo
    # publicado, y por eso llevaba meses pasando sin que se notara.
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write      # crear la release y subirle los archivos
  id-token: write      # OIDC: procedencia de npm y atestación de sigstore
  attestations: write  # guardar la atestación en el repo

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # EL PROXIO, AL LADO. Los E2E no simulan la red: levantan un proxio de verdad desde
      # el repo hermano (`../dotrino-proxy/server.js`), que es lo que hace que prueben el
      # protocolo y no una maqueta. En CI solo se clona este repo, así que hay que traerlo.
      #
      # Se clona SIN histórico y en la ruta exacta que espera el harness. Si algún día
      # cambia esa ruta, esto se cae aquí y no en silencio.
      - name: Clonar el proxio (lo necesitan los E2E)
        run: git clone --depth 1 https://github.com/imdotrino/dotrino-proxy.git ../dotrino-proxy

      - uses: actions/setup-node@v4
        with:
          # La publicación de confianza pide Node ≥22.14 y npm ≥11.5.1, y Node 22 trae
          # npm 10: por eso el paso siguiente lo sube. Pero NO se fija `22.14` exacto —
          # se probó y npm 12 exige `^22.22.2`, así que el pin dejaba el `npm i -g` sin
          # poder instalarse. `22` a secas coge el último 22.x, que cumple las dos.
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm i -g npm@latest
      - run: npm ci

      # El proxio tiene sus propias dependencias (`ws`, los pilares…) y sin ellas no
      # arranca, así que los E2E se quedarían esperando a un puerto que nunca escucha.
      - name: Dependencias del proxio
        working-directory: ../dotrino-proxy
        run: npm install --omit=dev

      # LAS PRUEBAS VAN ANTES DE PUBLICAR, no después. Una versión que no pasa su suite no
      # llega a npm: es lo único que impide publicar algo roto a mano un viernes.
      - run: npm test
      # El registro de compatibilidad (dotrino-roadmap, CONVENCIONES §14): nada instalado en
      # una versión marcada rota ni por debajo de lo que exige la ficha. Con @latest, que trae
      # la lista de rotas más nueva. Va antes de publicar: aquí sí frena.
      - run: npx --yes @dotrino/roadmap@latest check

      # LA VENTANA (desktop/, Rust) va dentro del .deb, el .rpm y el tarball.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }

      - name: Construir el binario, la ventana, el tarball y el .deb
        run: bash packaging/build-deb.sh

      # El daemon de Windows se construye AQUÍ, cruzado (ver build-win.sh): el job de Windows
      # solo compila la ventana y arma el instalador con este binario.
      - name: Construir el daemon de Windows
        run: bash packaging/build-win.sh
      - uses: actions/upload-artifact@v4
        with:
          name: win-vaultd
          path: |
            dist/dotrino-vaultd.exe
            dist/dotrino-vault.cmd

      # El .rpm (Fedora, RHEL, openSUSE) sale del MISMO binario que el .deb: build-rpm.sh ve
      # que el de dist/ ya es de esta versión y no lo reconstruye. `rpmbuild` no viene en el
      # runner de Ubuntu; lo trae el paquete `rpm`.
      - name: Construir el .rpm
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          bash packaging/build-rpm.sh

      # LA BÓVEDA EN UNA LAMBDA (lambda/README.md): el zip del código y la plantilla de
      # CloudFormation que lo apunta, con la URL de esta release y el hash ya puestos. Quien
      # despliega solo sube la plantilla; la pila baja el zip y lo comprueba.
      - name: La Lambda (zip + plantilla)
        run: bash lambda/build.sh

      # SBOM: la lista de lo que va dentro. Deja de ser opcional con el CRA y es lo primero
      # que pide un comprador corporativo.
      - name: SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@latest \
            --omit dev --output-format JSON \
            --output-file "dist/dotrino-vault-$(node -p "require('./package.json').version")-sbom.cdx.json"

      # La firma. `attest-build-provenance` deja una atestación en sigstore que ata cada
      # archivo a este commit y a este workflow. No hace falta guardar ninguna llave.
      - name: Atestiguar los artefactos
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*-sbom.cdx.json
            dist/dotrino-vault-lambda-*.zip
            dist/dotrino-vault-lambda-*.yaml

      # PUBLICACIÓN DE CONFIANZA: sin token, en ningún sitio.
      #
      # npm cambia un credencial efímero por la identidad OIDC de ESTA ejecución, así que no
      # hay nada guardado que robar ni que rotar. La confianza se declara en npmjs.com, por
      # paquete: «confío en imdotrino/dotrino-vault, workflow release.yml». **El nombre del
      # archivo tiene que coincidir exactamente**, extensión incluida — si algún día se
      # renombra este workflow, hay que cambiarlo también allí o la publicación se cae.
      #
      # Y la procedencia sale sola: npm la genera y la firma, sin `--provenance`.
      #
      # Cuenta PERSONAL, no organización (`imdotrino` es un User), así que no hay secretos de
      # organización: con tokens habría que meter el mismo en los 22 repos que publican. Por
      # eso se eligió este camino y no aquel.
      # SOLO LO QUE NO ESTÉ YA PUBLICADO. El repo publica DOS paquetes y no siempre
      # cambian los dos: si la librería no se tocó, su versión ya está en npm y
      # `publish` corta el release entero por algo que no es un fallo — «ya estaba» no
      # es un error, es que no había nada que hacer.
      #
      # No es un repliegue que tape nada: se comprueba la versión EXACTA contra el
      # registro y se dice en voz alta cuál se saltó. Lo que sí seguiría fallando, y
      # debe, es un publish rechazado por permisos o por una confianza mal declarada.
      - name: Publicar @dotrino/vault (la librería)
        working-directory: lib
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@dotrino/vault@$V" version >/dev/null 2>&1; then
            echo "@dotrino/vault@$V ya está publicada: nada que hacer"
          else
            npm publish --access public
          fi

      - name: Publicar @dotrino/vaultd (el daemon)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@dotrino/vaultd@$V" version >/dev/null 2>&1; then
            echo "@dotrino/vaultd@$V ya está publicada: nada que hacer"
          else
            npm publish --access public
          fi

      # `@dotrino/env` NO tiene código propio: su `bin` es un `import` de cinco líneas a
      # `@dotrino/vault`. Su versión y su rango se mantenían A MANO y derivaron — lo
      # publicado pedía `^0.33.2` mientras `lib` iba por 0.60.2, y como en `0.x` el caret
      # no cruza la minor, `npm i -g @dotrino/env` instalaba un cliente veintisiete
      # versiones atrás. El síntoma no era un fallo al instalar sino algo peor: enrolar
      # contra un vault al día devolvía `invalid cert: no-acta`.
      #
      # Publicarlo a mano «en la misma tanda» ya estaba escrito en el checklist y aun así
      # pasó, así que el número deja de estar en manos de nadie: el script lo deriva de
      # `lib` y publica, saltándose lo que ya esté.
      # LA RELEASE VA ANTES QUE EL ENVOLTORIO, y el orden importa.
      #
      # Estaba al revés y se pagó dos veces seguidas: el paso del envoltorio se cayó
      # —primero por el retraso del registro, después porque `@dotrino/env` no tiene
      # declarada la publicación de confianza— y se llevó por delante la release entera. El
      # `.deb`, el tarball y el SBOM se habían construido y atestiguado, y no llegaron a
      # ninguna parte por un paquete de cinco líneas que solo reexporta un `bin`.
      #
      # Lo que se publica y lo que se distribuye son cosas distintas: un fallo en lo segundo
      # no puede borrar lo primero. El paso sigue rompiendo la ejecución si falla —se ve en
      # rojo, que es lo que tiene que pasar— pero ya no se lleva nada con él.
      - name: Publicar la release con sus archivos
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*-sbom.cdx.json
            dist/dotrino-vault-lambda-*.zip
            dist/dotrino-vault-lambda-*.yaml
          generate_release_notes: true

      # ⚠️ Este paso necesita que `@dotrino/env` tenga declarada la PUBLICACIÓN DE CONFIANZA
      # en npmjs.com (repo `imdotrino/dotrino-vault`, workflow `release.yml`), igual que
      # `@dotrino/vault` y `@dotrino/vaultd`. Sin eso npm contesta 404 al publicar —oculta
      # el «no autorizado» como «no encontrado»— y este paso sale en rojo hasta que se
      # declare. Es una casilla en la web, no algo que se arregle desde aquí.
      - name: Publicar @dotrino/env (el envoltorio)
        run: node packaging/release-env.mjs --publish

  # ------------------------------------------------------------------------------------------
  # WINDOWS: la ventana (compilada aquí, MSVC) + el daemon del job de Linux, en un instalador
  # por usuario (Inno Setup, sin administrador). Solo con tag: necesita la release ya creada.
  windows:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - name: La ventana
        working-directory: desktop
        run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with: { name: win-vaultd, path: dist/win }
      - name: El instalador
        shell: pwsh
        run: |
          Copy-Item desktop/target/release/dotrino-vault-desktop.exe dist/win/
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = node -p "require('./package.json').version"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSrc=$pwd\dist\win" packaging\windows\dotrino-vault.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*-setup.exe
      - name: Subir a la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*-setup.exe --clobber

  # ------------------------------------------------------------------------------------------
  # macOS: el daemon (SEA universal) y la ventana (universal), juntos en «Dotrino Vault.app».
  macos:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: El daemon
        run: bash packaging/build-mac.sh
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - name: La ventana (universal)
        working-directory: desktop
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/dotrino-vault-desktop \
            target/aarch64-apple-darwin/release/dotrino-vault-desktop \
            target/x86_64-apple-darwin/release/dotrino-vault-desktop
      - name: La app
        run: sh desktop/scripts/macos-bundle.sh "$PWD/desktop/target/universal/dotrino-vault-desktop" "$PWD/dist/dotrino-vaultd-macos"
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: desktop/dist/*.zip
      - name: Subir a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" desktop/dist/*.zip --clobber
